<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - GiveForward</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="container nav">
    <a href="index.html" class="brand">
      <span>♥</span> GiveForward
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="create.html">Start a fundraiser</a>
    </nav>
  </div>
</header>

<main class="account-page">
  <div class="container account-grid">

    <section>
      <div class="kicker">Your GiveForward account</div>

      <h1>Manage your fundraisers in one place.</h1>

      <p class="muted-text">
        Create an account to start fundraisers and keep track of your campaigns.
      </p>

      <div class="account-points">
        <div>✓ Create and manage fundraisers</div>
        <div>✓ Track campaign progress</div>
        <div>✓ Keep your fundraiser details organized</div>
      </div>
    </section>

    <section class="form-card account-card">

      <div class="tabs">
        <button class="tab active" id="loginTab" onclick="showLogin()">
          Sign in
        </button>

        <button class="tab" id="signupTab" onclick="showSignup()">
          Create account
        </button>
      </div>

      <form id="authForm">

        <label id="nameField" class="hidden">
          Full name
          <input type="text" id="name" placeholder="Your name">
        </label>

        <label>
          Email address
          <input type="email" id="email" required placeholder="you@example.com">
        </label>

        <label>
          Password
          <input type="password" id="password" required
                 minlength="6" placeholder="At least 6 characters">
        </label>

        <button class="btn large full" type="submit" id="submitButton">
          Sign in
        </button>

        <p id="message" class="tiny"></p>

      </form>

    </section>

  </div>
</main>

<script src="supabase.js"></script>

<script>
  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let mode = "login";

  function showLogin() {
    mode = "login";

    document.getElementById("nameField").classList.add("hidden");
    document.getElementById("submitButton").textContent = "Sign in";

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");

    document.getElementById("message").textContent = "";
  }

  function showSignup() {
    mode = "signup";

    document.getElementById("nameField").classList.remove("hidden");
    document.getElementById("submitButton").textContent = "Create account";

    document.getElementById("signupTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");

    document.getElementById("message").textContent = "";
  }

  document.getElementById("authForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    button.disabled = true;
    message.textContent = "Please wait...";

    try {
      if (mode === "signup") {

        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

        if (error) throw error;

        message.textContent =
          "Account created. Check your email if confirmation is required.";

      } else {

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        message.textContent = "Signed in successfully!";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);
      }

    } catch (error) {
      message.textContent = error.message;
    }

    button.disabled = false;
  });
</script>

</body>
</html>
