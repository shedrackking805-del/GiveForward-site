<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fundraiser — GiveForward</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="container nav"><a href="index.html" class="brand"><span>♥</span> GiveForward</a><nav><a href="index.html#discover">Discover</a><a href="create.html" class="btn">Start a fundraiser</a></nav></div></header>
<main class="campaign-wrap"><div class="container campaign-layout">
 <article><div id="campaign-image" class="campaign-image">Fundraiser</div><div class="kicker" id="category"></div><h1 id="title">Loading...</h1><p class="story" id="story"></p></article>
 <aside class="donate-box"><div class="bar"><i id="progress"></i></div><div class="raised"><b id="raised"></b><span id="goal"></span></div><p id="donors" class="muted-text"></p><button class="btn full" onclick="openDonate()">Donate now</button><button class="outline full" onclick="share()">Share fundraiser</button><div class="note">Secure payment processing can be connected when the payment provider is configured.</div></aside>
</div></main>
<div id="modal" class="modal"><div class="modal-card"><button class="close" onclick="closeDonate()">×</button><h2>Support this fundraiser</h2><p class="muted-text">Choose an amount to continue.</p><div class="amounts"><button onclick="pick(10)">$10</button><button onclick="pick(25)">$25</button><button onclick="pick(50)">$50</button><button onclick="pick(100)">$100</button></div><input id="custom" type="number" min="1" placeholder="Custom amount"><button class="btn full" onclick="checkout()">Continue</button><p class="tiny">Demo checkout — no money is charged in this prototype.</p></div></div>
<script src="app.js"></script></body></html>
