<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Fundraiser — GiveForward</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header>

  <div class="container nav">

    <a
      href="index.html"
      class="brand"
    >

      <span>♥</span>
      GiveForward

    </a>


    <nav>

      <a href="index.html">
        Discover
      </a>

      <a href="create.html">
        Start a fundraiser
      </a>

    </nav>

  </div>

</header>



<main class="container">

  <div class="campaign-layout">


    <!-- CAMPAIGN -->

    <section class="campaign-main">


      <div
        id="campaign-image"
        class="campaign-image"
      >
        GiveForward
      </div>


      <div
        id="category"
        class="kicker"
      >
        Fundraiser
      </div>


      <h1 id="title">
        Loading fundraiser...
      </h1>


      <div class="story">

        <p id="story">
          Loading fundraiser story...
        </p>

      </div>


    </section>



    <!-- DONATION CARD -->

    <aside class="donation-card">


      <div class="progress-wrap">

        <div
          id="progress"
          class="progress"
          style="width:0%"
        ></div>

      </div>


      <p>

        <strong id="raised">
          $0
        </strong>

        <span id="goal">
          raised of $0
        </span>

      </p>


      <p
        id="donors"
        class="muted-text"
      >
        0 people have donated
      </p>


      <button
        type="button"
        class="btn primary"
        onclick="openDonate()"
      >
        Donate
      </button>


      <button
        type="button"
        class="btn secondary"
        onclick="share()"
      >
        Share
      </button>


    </aside>


  </div>

</main>



<!-- DONATION MODAL -->

<div
  id="modal"
  class="modal"
>


  <div class="modal-content">


    <button
      type="button"
      class="close"
      onclick="closeDonate()"
      aria-label="Close"
    >
      ×
    </button>


    <h2>
      Support this fundraiser
    </h2>


    <p>
      Choose how much you'd like to donate.
    </p>



    <!-- AMOUNT BUTTONS -->

    <div class="amount-options">


      <button
        type="button"
        onclick="pick(10)"
      >
        $10
      </button>


      <button
        type="button"
        onclick="pick(25)"
      >
        $25
      </button>


      <button
        type="button"
        onclick="pick(50)"
      >
        $50
      </button>


      <button
        type="button"
        onclick="pick(100)"
      >
        $100
      </button>


    </div>



    <label for="custom">
      Donation amount
    </label>


    <input
      id="custom"
      type="number"
      min="1"
      step="0.01"
      value="25"
      placeholder="Enter amount"
    >



    <label for="donorEmail">
      Email address
    </label>


    <input
      id="donorEmail"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
    >



    <button
      id="paymentButton"
      type="button"
      class="btn primary"
      onclick="checkout()"
    >
      Continue to payment
    </button>


    <p class="payment-note">
      You'll be redirected to Flutterwave to complete your donation.
    </p>


  </div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase.js"></script>


<!-- GIVEFORWARD APP -->

<script src="app.js"></script>



<!-- PAYMENT -->

<script>

async function checkout() {

  const button =
    document.getElementById(
      "paymentButton"
    );


  const amount =
    Number(
      document.getElementById(
        "custom"
      ).value
    );


  const email =
    document.getElementById(
      "donorEmail"
    ).value.trim();


  const campaignId =
    new URLSearchParams(
      window.location.search
    ).get("id");


  if (!amount || amount <= 0) {

    alert(
      "Please enter a valid donation amount."
    );

    return;

  }


  if (!email) {

    alert(
      "Please enter your email address."
    );

    return;

  }


  if (!email.includes("@")) {

    alert(
      "Please enter a valid email address."
    );

    return;

  }


  if (!campaignId) {

    alert(
      "Campaign ID is missing."
    );

    return;

  }


  const txRef =
    "GF-" +
    Date.now();


  const redirectUrl =
    window.location.origin +
    window.location.pathname +
    "?id=" +
    encodeURIComponent(
      campaignId
    );


  button.disabled = true;

  button.textContent =
    "Connecting to payment...";


  try {

    /*
     * Send the donation request
     * directly to the Supabase
     * Edge Function.
     */

    const response =
      await fetch(
        SUPABASE_URL +
        "/functions/v1/create-flutterwave-payment",
        {

          method: "POST",


          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_PUBLISHABLE_KEY

          },


          body:
            JSON.stringify({

              amount:
                amount,

              currency:
                "USD",

              email:
                email,

              name:
                "GiveForward Donor",

              tx_ref:
                txRef,

              campaign_id:
                campaignId,

              redirect_url:
                redirectUrl

            })

        }
      );


    let data;


    try {

      data =
        await response.json();

    }

    catch {

      throw new Error(
        "The payment server returned an invalid response."
      );

    }


    console.log(
      "GiveForward payment response:",
      data
    );


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Payment server returned an error."
      );

    }


    if (
      !data.payment_link
    ) {

      throw new Error(
        "Flutterwave payment link was not returned."
      );

    }


    /*
     * Send donor to
     * Flutterwave checkout.
     */

    window.location.href =
      data.payment_link;

  }


  catch (error) {

    console.error(
      "GiveForward payment error:",
      error
    );


    alert(
      "Payment connection failed: " +
      error.message
    );


    button.disabled =
      false;


    button.textContent =
      "Continue to payment";

  }

}

</script>


</body>
  </html>
