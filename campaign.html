<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign — GiveForward</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container nav"><a class="logo" href="index.html">GiveForward</a><nav><a href="index.html#discover">Discover</a><a href="create.html" class="nav-button">Start a fundraiser</a></nav></div></header>
<main class="campaign-page">
  <div class="container">
    <div class="campaign-layout">
      <section>
        <div id="campaign-image" class="campaign-image"></div>
        <p class="eyebrow" id="campaign-category"></p>
        <h1 id="campaign-title">Loading...</h1>
        <p id="campaign-story" class="story"></p>
      </section>
      <aside class="donation-card">
        <div class="progress"><span id="campaign-progress"></span></div>
        <div class="money"><strong id="campaign-raised"></strong><span id="campaign-goal"></span></div>
        <p id="campaign-donors" class="muted"></p>
        <button class="primary-button full" onclick="donate()">Donate now</button>
        <button class="secondary-button full" onclick="shareCampaign()">Share fundraiser</button>
        <hr>
        <p class="small">Your donation supports this fundraiser. Payment processing will be connected in a later step.</p>
      </aside>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
